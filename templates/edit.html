
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task | TaskFlow</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="content-card mx-auto" style="max-width:600px;">

        <h4 class="mb-2">Edit Task</h4>
        <p class="text-muted">Update your task details and deadline.</p>

        <form method="POST">

            <label class="form-label">Task Title</label>
            <input type="text" name="title"
                   class="form-control mb-3"
                   value="{{ task.title }}" required>

            <label class="form-label">Description</label>
            <textarea name="description"
                      class="form-control mb-3"
                      rows="4">{{ task.description }}</textarea>

            <label class="form-label">Priority</label>
            <select name="priority" class="form-select mb-3">
                <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
                <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
                <option value="High" {% if task.priority == 'High' %}selected{% endif %}>High</option>
            </select>

            <label class="form-label">Task Deadline</label>
            <input type="date" name="due_date"
                   class="form-control mb-4"
                   value="{{ task.due_date or '' }}">

            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

            <a href="/" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>
</div>

</body>
</html>
